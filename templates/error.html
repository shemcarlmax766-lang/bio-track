{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block body %}
<div class="auth-card">
  <div class="auth-head">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="40" height="40">
    <h1>Error {{ code }}</h1>
    <p>{{ message }}</p>
  </div>
  <div style="display:flex;gap:10px;justify-content:center">
    <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Dashboard</a>
    {% if not current_user() %}<a class="btn btn-ghost" href="{{ url_for('auth.login') }}">Sign in</a>{% endif %}
  </div>
</div>
{% endblock %}
